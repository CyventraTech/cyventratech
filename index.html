<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo-icon.png" />
    <link rel="apple-touch-icon" href="/logo-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>CYVENTRA Technologies | Cybersecurity, Cloud & IT Solutions</title>
    <meta name="description" content="CYVENTRA Technologies delivers end-to-end IT solutions — cybersecurity, cloud migration, AI automation, CCTV, website development, and managed IT services for businesses of every scale." />
    <meta name="keywords" content="cybersecurity, cloud services, IT solutions, AI automation, CCTV security, website development, network management, data backup, Microsoft 365, Cuttack, Odisha, India" />
    <meta name="author" content="CYVENTRA Technologies" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://cyventratech.com/" />

    <!-- Open Graph (Facebook, LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://cyventratech.com/" />
    <meta property="og:title" content="CYVENTRA Technologies | Cybersecurity, Cloud & IT Solutions" />
    <meta property="og:description" content="End-to-end technology services — cybersecurity, cloud, AI automation, CCTV, and IT support for businesses in India and worldwide." />
    <meta property="og:image" content="https://cyventratech.com/logo-full.png" />
    <meta property="og:site_name" content="CYVENTRA Technologies" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CYVENTRA Technologies | Cybersecurity, Cloud & IT Solutions" />
    <meta name="twitter:description" content="End-to-end technology services — cybersecurity, cloud, AI automation, CCTV, and IT support." />
    <meta name="twitter:image" content="https://cyventratech.com/logo-full.png" />

    <!-- Performance: preconnect for fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Performance: preload logo -->
    <link rel="preload" as="image" href="/logo-full.png" />

    <!-- Schema.org structured data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "CYVENTRA Technologies",
      "url": "https://cyventratech.com",
      "logo": "https://cyventratech.com/logo-full.png",
      "description": "End-to-end IT solutions — cybersecurity, cloud migration, AI automation, CCTV, website development, and managed IT services.",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "Nayabazar",
        "addressLocality": "Cuttack",
        "addressRegion": "Odisha",
        "addressCountry": "IN"
      },
      "contactPoint": {
        "@type": "ContactPoint",
        "email": "support@cyventratech.com",
        "contactType": "customer support"
      },
      "sameAs": [
        "https://linkedin.com",
        "https://twitter.com"
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
